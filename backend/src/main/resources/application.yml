spring:
  application:
    name: nurai-backend

  datasource:
    url: jdbc:mysql://localhost:3307/nurai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: nurai
    password: nurai123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${PORT:8082}
  error:
    include-message: always
    include-binding-errors: always

nurai:
  jwt:
    secret: ${JWT_SECRET:NurAI2026HackathonSecretKeyUNICEFMauritaniaChildNutritionDetection}
    expiration: 86400000
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
  uploads:
    dir: ./uploads

logging:
  level:
    com.nurai: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
