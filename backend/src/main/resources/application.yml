spring:
  application:
    name: nurai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./nurai;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${PORT:8082}
  error:
    include-message: always
    include-binding-errors: always

nurai:
  jwt:
    secret: ${JWT_SECRET:NurAI2026HackathonSecretKeyUNICEFMauritaniaChildNutritionDetection}
    expiration: 86400000
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
  uploads:
    dir: ./uploads

logging:
  level:
    com.nurai: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
